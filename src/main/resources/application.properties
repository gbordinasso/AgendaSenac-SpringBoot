spring.application.name=agendasenac

# Configuraçãoo da conexão com o banco de dados (H2)
spring.datasource.url=jdbc:h2:mem:agendasenac
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=agendasenac_admin2026

# Configuração do Hibernat/JPA para criar as tabelas automaticamente
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show.sql=true

# Configuração do console do H2 para acesso remoto (localhost)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console